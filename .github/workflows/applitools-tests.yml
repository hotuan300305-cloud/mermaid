name: Applitools E2E (Develop Branch)

on:
  push:
    branches:
      - develop
      - applitools_workflow
    paths:
      - '.github/workflows/applitools-tests.yml'
  workflow_dispatch:
    # Manual triggering only - to limit Applitools usage
    inputs:
      parent_branch:
        required: true
        type: string
        default: master
        description: 'Parent branch to use for PRs'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  # on PRs from forks, this secret will always be empty, for security reasons
  USE_APPLI: ${{ secrets.APPLITOOLS_API_KEY && 'true' || '' }}

jobs:
  applitools-e2e:
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:node-22.18.0-chrome-139.0.7258.127-1-ff-141.0.3-edge-139.0.3405.86-1
      options: --user 1001

    steps:
      - if: ${{ ! env.USE_APPLI }}
        name: Warn if not using Applitools
        run: |
          echo "::error,title=Not using Applitools::APPLITOOLS_API_KEY is empty, disabling Applitools for this run."

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        # uses version from "packageManager" field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Cache Cypress
        uses: actions/cache@v4
        with:
          path: /root/.cache/Cypress
          key: cypress-cache-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            cypress-cache-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CYPRESS_CACHE_FOLDER: /root/.cache/Cypress

      - if: ${{ env.USE_APPLI }}
        name: Notify applitools of new batch
        # Copied from docs https://applitools.com/docs/topics/integrations/github-integration-ci-setup.html
        env:
          # e.g. mermaid-js/mermaid/my-branch
          APPLITOOLS_BRANCH: ${{ github.repository }}/${{ github.ref_name }}
          APPLITOOLS_PARENT_BRANCH: ${{ github.event.inputs.parent_branch || 'master' }}
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
          APPLITOOLS_SERVER_URL: 'https://eyesapi.applitools.com'
        uses: wei/curl@012398a392d02480afa2720780031f8621d5f94c
        with:
          args: -X POST "$APPLITOOLS_SERVER_URL/api/externals/github/push?apiKey=$APPLITOOLS_API_KEY&CommitSha=$GITHUB_SHA&BranchName=${APPLITOOLS_BRANCH}&ParentBranchName=$APPLITOOLS_PARENT_BRANCH"

      - name: Run basic Cypress test
        uses: cypress-io/github-action@18a6541367f4580a515371905f499a27a44e8dbe # v6.7.12
        with:
          start: pnpm run dev
          wait-on: 'http://localhost:9000'
          browser: chrome
          spec: 'cypress/integration/rendering/zenuml.spec.js'
        env:
          # Ensure server binds to all interfaces
          HOST: '0.0.0.0'
          PORT: '9000'
          # Disable Applitools for basic test
          USE_APPLI: ''

      - if: ${{ env.USE_APPLI }}
        name: Run Cypress with Applitools
        uses: cypress-io/github-action@18a6541367f4580a515371905f499a27a44e8dbe # v6.7.12
        with:
          start: pnpm run dev
          wait-on: 'http://localhost:9000'
          browser: chrome
          spec: 'cypress/integration/rendering/zenuml.spec.js'
        env:
          # Mermaid applitools.config.js uses this to pick batch name
          APPLI_BRANCH: ${{ github.ref_name }}
          APPLITOOLS_BATCH_ID: ${{ github.sha }}
          # e.g. mermaid-js/mermaid/my-branch
          APPLITOOLS_BRANCH: ${{ github.repository }}/${{ github.ref_name }}
          APPLITOOLS_PARENT_BRANCH: ${{ github.event.inputs.parent_branch || 'master' }}
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
          APPLITOOLS_SERVER_URL: 'https://eyesapi.applitools.com'
          # Ensure server binds to all interfaces
          HOST: '0.0.0.0'
          PORT: '9000'
          # Enable Applitools
          USE_APPLI: 'true'
